<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>모기팡팡</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#000;color:#fff;font-family:"Jua","Malgun Gothic","Apple SD Gothic Neo",sans-serif;overflow:hidden;user-select:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2.2vmin;padding:3vmin;text-align:center;background:radial-gradient(circle at 50% 30%,#2a2a2a,#000 70%)}
.screen.on{display:flex}
.logo{position:relative;display:inline-block;padding:3vmin 7vmin;background:#ffc400;clip-path:polygon(50% 0,60% 12%,75% 4%,78% 20%,95% 18%,88% 36%,100% 50%,88% 64%,95% 82%,78% 80%,75% 96%,60% 88%,50% 100%,40% 88%,25% 96%,22% 80%,5% 82%,12% 64%,0 50%,12% 36%,5% 18%,22% 20%,25% 4%,40% 12%);}
.logo .s{display:block;font-size:3.2vmin;background:#7a4a1c;color:#ffe9a8;border-radius:1vmin;padding:.3vmin 2vmin;margin:0 auto 1vmin;width:max-content}
.logo .b{display:block;font-size:11vmin;line-height:1;color:#fff;-webkit-text-stroke:.7vmin #3a2a10;paint-order:stroke fill;text-shadow:0 .6vmin 0 #3a2a10}
.logo .b.r{color:#ff3b30}
h2{font-size:5vmin;font-weight:normal}
p.sub{font-size:3vmin;opacity:.85;max-width:90vw;line-height:1.5}
.btns{display:flex;gap:2.5vmin;flex-wrap:wrap;justify-content:center}
button{font-family:inherit;font-size:4.2vmin;border:0;border-radius:3vmin;padding:2vmin 4.5vmin;background:#ffc400;color:#3a2a10;box-shadow:0 1vmin 0 #b58900;cursor:pointer}
button:active{transform:translateY(.6vmin);box-shadow:0 .4vmin 0 #b58900}
button.red{background:#ff4d3d;color:#fff;box-shadow:0 1vmin 0 #b02a1e}
button.blue{background:#3b8bff;color:#fff;box-shadow:0 1vmin 0 #1f58b3}
button.gray{background:#ddd;box-shadow:0 1vmin 0 #999;font-size:3vmin;padding:1.4vmin 3vmin}
.opt{display:flex;gap:1.5vmin;align-items:center;font-size:3.2vmin}
.chip{padding:1vmin 2.4vmin;border-radius:5vmin;background:#333;cursor:pointer;border:.4vmin solid transparent}
.chip.sel{background:#ffc400;color:#3a2a10}
#game{position:absolute;inset:0;display:none;background:#000}
#game.on{display:block}
canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.hud{position:absolute;top:2vmin;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 2.5vmin;pointer-events:none}
.pill{font-size:4.6vmin;padding:.8vmin 2.4vmin;border-radius:2vmin;border:.5vmin solid #fff;box-shadow:0 .5vmin 0 rgba(0,0,0,.4)}
.pill.r{background:#ff4d3d}.pill.b{background:#3b8bff}
.pill.t{background:#ffc400;color:#3a2a10;border-color:#7a4a1c;min-width:9vmin;text-align:center}
#caption{position:absolute;left:0;right:0;bottom:3vmin;text-align:center;font-size:4.5vmin;text-shadow:0 .4vmin 0 #000,0 0 1vmin #000;pointer-events:none}
#count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:30vmin;color:#ffc400;text-shadow:0 1vmin 0 #3a2a10;pointer-events:none}
#msg{position:absolute;bottom:3vmin;left:0;right:0;text-align:center;font-size:2.6vmin;opacity:.7}
.big{font-size:8vmin;color:#ffc400;text-shadow:0 .6vmin 0 #3a2a10}
.score{display:flex;gap:6vmin;font-size:7vmin}
.sr{color:#ff6b5d}.sb{color:#6ba8ff}
</style>
</head>
<body>
<div id="app">

<!-- 시작 화면 -->
<div class="screen on" id="sHome">
  <div class="logo"><span class="s">신나는</span><span class="b">모기</span><span class="b r">팡팡</span></div>
  <p class="sub">카메라 앞에서 손을 휘휘~ 저어 모기를 잡아요!<br>손이 노란 파리채로 변해요.</p>
  <div class="opt"><span>시간</span>
    <span class="chip" data-t="10">10초</span><span class="chip sel" data-t="15">15초</span><span class="chip" data-t="20">20초</span><span class="chip" data-t="30">30초</span>
  </div>
  <div class="btns">
    <button id="bSolo">🦟 함께 잡기</button>
    <button id="bVs" class="red">⚔️ 1:1 대결</button>
  </div>
  <p class="sub" style="font-size:2.4vmin">처음에 카메라 허용을 눌러 주세요 · 인터넷이 연결되어 있어야 손 인식이 잘 돼요</p>
</div>

<!-- 준비 화면 -->
<div class="screen" id="sLoad"><h2 id="loadTxt">카메라를 켜는 중...</h2><p class="sub" id="loadSub">잠시만 기다려 주세요</p></div>

<!-- 게임 -->
<div id="game">
  <canvas id="cv"></canvas>
  <div class="hud" id="hud"></div>
  <div id="caption"></div>
  <div id="count"></div>
  <div id="msg"></div>
</div>

<!-- 결과 -->
<div class="screen" id="sEnd">
  <h2 class="big" id="endTitle">끝!</h2>
  <div class="score" id="endScore"></div>
  <p class="sub" id="endSub"></p>
  <div class="btns"><button id="bAgain">다시 하기</button><button id="bHome" class="gray">처음으로</button></div>
</div>
</div>

<script type="module">
const $=s=>document.querySelector(s);
const cv=$('#cv'),ctx=cv.getContext('2d');
let mode='solo',dur=15,stream=null,video=document.createElement('video');
video.playsInline=true;video.muted=true;
let hands=null,useHands=false;       // MediaPipe
let W=0,H=0;                         // 캔버스 크기
const show=id=>{document.querySelectorAll('.screen').forEach(e=>e.classList.remove('on'));$('#game').classList.remove('on');if(id==='game')$('#game').classList.add('on');else $('#'+id).classList.add('on');};

document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('sel'));c.classList.add('sel');dur=+c.dataset.t;});
$('#bSolo').onclick=()=>start('solo');
$('#bVs').onclick=()=>start('vs');
$('#bAgain').onclick=()=>start(mode);
$('#bHome').onclick=()=>show('sHome');

/* ---------- 소리 ---------- */
let ac=null;
function audio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}return ac}
function pop(){const a=audio();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type='square';o.frequency.setValueAtTime(520+Math.random()*200,a.currentTime);o.frequency.exponentialRampToValueAtTime(90,a.currentTime+.12);g.gain.setValueAtTime(.18,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.14);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.15)}
function beep(f=660,l=.15){const a=audio();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.setValueAtTime(.2,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+l);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+l)}

/* ---------- 카메라 / 손 인식 ---------- */
async function initCamera(){
  if(stream)return;
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false});
  video.srcObject=stream;await video.play();
}
async function initHands(){
  if(hands||useHands===null)return;
  try{
    const mod=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
    const fs=await mod.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    hands=await mod.HandLandmarker.createFromOptions(fs,{
      baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'},
      runningMode:'VIDEO',numHands:8});
    useHands=true;
  }catch(e){console.warn('손 인식을 불러오지 못해 움직임 인식으로 대신해요',e);useHands=false;hands=null;}
}

/* ---------- 움직임 인식(대체) ---------- */
const MW=48,MH=27;const mc=document.createElement('canvas');mc.width=MW;mc.height=MH;const mx=mc.getContext('2d',{willReadFrequently:true});
let prev=null;
function motionPoints(){
  mx.drawImage(video,0,0,MW,MH);const d=mx.getImageData(0,0,MW,MH).data;
  const cur=new Float32Array(MW*MH);for(let i=0;i<MW*MH;i++)cur[i]=(d[i*4]+d[i*4+1]+d[i*4+2])/3;
  const pts=[];
  if(prev){
    const on=new Uint8Array(MW*MH);
    for(let i=0;i<MW*MH;i++)on[i]=Math.abs(cur[i]-prev[i])>28?1:0;
    const seen=new Uint8Array(MW*MH);
    for(let i=0;i<MW*MH;i++){if(!on[i]||seen[i])continue;
      const st=[i];seen[i]=1;let sx=0,sy=0,n=0;
      while(st.length){const k=st.pop(),x=k%MW,y=(k/MW)|0;sx+=x;sy+=y;n++;
        for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=MW||ny>=MH)continue;const j=ny*MW+nx;if(on[j]&&!seen[j]){seen[j]=1;st.push(j)}}}
      if(n>=4)pts.push({x:1-(sx/n+.5)/MW,y:(sy/n+.5)/MH,n});}
    pts.sort((a,b)=>b.n-a.n);
  }
  prev=cur;return pts.slice(0,4);
}

/* ---------- 게임 상태 ---------- */
let mos=[],fx=[],swats=[],score={r:0,b:0,t:0},tLeft=0,state='idle',lastT=0,raf=0,lastHand=0,tick=0;
const MAXMOS=()=>mode==='vs'?26:20;

function resize(){
  const vw=video.videoWidth||1280,vh=video.videoHeight||720,ar=vw/vh;
  const sw=innerWidth,sh=innerHeight;
  let w=sw,h=w/ar;if(h>sh){h=sh;w=h*ar}
  cv.width=Math.round(w);cv.height=Math.round(h);W=cv.width;H=cv.height;
}
addEventListener('resize',()=>{if(state!=='idle')resize()});

function spawn(){
  const edge=Math.random()<.5;
  const m={x:Math.random()*W,y:edge?-30:Math.random()*H*.6,a:Math.random()*6.28,sp:60+Math.random()*60,ph:Math.random()*9,s:.8+Math.random()*.5,t:0};
  m.x=edge?m.x:(Math.random()<.5?-30:W+30);
  mos.push(m);
}
function updateMos(dt){
  for(const m of mos){
    m.t+=dt;m.ph+=dt*38;
    // 천천히 방향을 바꾸며 날아다님, 가끔 화면 안쪽으로
    m.a+=(Math.random()-.5)*5*dt;
    const cx=W/2-m.x,cy=H/2-m.y;
    if(m.x<-40||m.x>W+40||m.y<-40||m.y>H+40)m.a=Math.atan2(cy,cx)+(Math.random()-.5);
    m.x+=Math.cos(m.a)*m.sp*dt*(1+Math.sin(m.t*3)*.3);
    m.y+=Math.sin(m.a)*m.sp*dt+Math.sin(m.ph*.2)*.6;
  }
}

function sideOf(x){return x<W/2?'r':'b'}   // 화면(거울) 기준 왼쪽=빨강, 오른쪽=파랑
function collide(){
  const R=Math.min(W,H)*.085;
  for(const s of swats){
    for(let i=mos.length-1;i>=0;i--){
      const m=mos[i];
      const dx=m.x-s.x,dy=m.y-(s.y-R*.2);
      if(dx*dx+dy*dy<R*R*1.1){
        mos.splice(i,1);pop();
        if(mode==='vs'){ // 자기 쪽에서 잡은 모기만 점수
          const sd=sideOf(m.x);score[sd]++;
        }else score.t++;
        for(let k=0;k<7;k++)fx.push({x:m.x,y:m.y,vx:(Math.random()-.5)*260,vy:(Math.random()-.5)*260,l:.45,c:'#ffeb3b'});
        fx.push({x:m.x,y:m.y,l:.35,ring:1});
      }
    }
  }
}

/* ---------- 그리기 ---------- */
function drawMos(m){
  ctx.save();ctx.translate(m.x,m.y);
  const dir=Math.cos(m.a)<0?-1:1;ctx.scale(m.s*dir*(W/900),m.s*(W/900));
  const f=Math.sin(m.ph)*.6;
  // 날개
  ctx.fillStyle='rgba(235,245,255,.85)';ctx.strokeStyle='rgba(60,60,60,.6)';ctx.lineWidth=1;
  for(const sgn of [-1,1]){ctx.save();ctx.translate(-2,-4);ctx.rotate(-1.1+sgn*f*.5);ctx.beginPath();ctx.ellipse(0,-12,5,14,0,0,6.28);ctx.fill();ctx.stroke();ctx.restore();}
  // 다리
  ctx.strokeStyle='#222';ctx.lineWidth=1.6;
  for(let i=0;i<3;i++){const ox=-8+i*7;ctx.beginPath();ctx.moveTo(ox,6);ctx.lineTo(ox-5+i*2,18+Math.sin(m.ph*.5+i)*2);ctx.lineTo(ox-9+i*3,24);ctx.stroke();}
  // 몸통
  ctx.fillStyle='#3a2f2a';ctx.beginPath();ctx.ellipse(-8,2,15,6.5,0,0,6.28);ctx.fill();
  ctx.fillStyle='#e8e0d4';for(let i=0;i<3;i++){ctx.fillRect(-18+i*6,-3,2.2,10)}
  ctx.fillStyle='#2b2320';ctx.beginPath();ctx.ellipse(8,1,8,7,0,0,6.28);ctx.fill();   // 가슴
  ctx.beginPath();ctx.arc(17,2,6,0,6.28);ctx.fill();                                // 머리
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(19,0,2.3,0,6.28);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(19.6,0,1.1,0,6.28);ctx.fill();
  ctx.strokeStyle='#111';ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(22,3);ctx.lineTo(34,8);ctx.stroke(); // 주둥이
  ctx.restore();
}
function drawSwat(s){
  const R=Math.min(W,H)*.085;
  ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.rot||0);
  // 손잡이
  ctx.fillStyle='#ff7a1a';ctx.strokeStyle='#b34700';ctx.lineWidth=3;
  ctx.beginPath();ctx.roundRect(-R*.09,R*.55,R*.18,R*1.05,R*.08);ctx.fill();ctx.stroke();
  // 채
  ctx.fillStyle='rgba(255,205,30,.94)';ctx.strokeStyle='#d9a000';ctx.lineWidth=4;
  ctx.beginPath();ctx.ellipse(0,-R*.2,R*.85,R*.95,0,0,6.28);ctx.fill();ctx.stroke();
  ctx.strokeStyle='rgba(190,130,0,.65)';ctx.lineWidth=2;
  ctx.save();ctx.beginPath();ctx.ellipse(0,-R*.2,R*.85,R*.95,0,0,6.28);ctx.clip();
  for(let i=-6;i<=6;i++){ctx.beginPath();ctx.moveTo(i*R*.16,-R*1.3);ctx.lineTo(i*R*.16,R);ctx.stroke();ctx.beginPath();ctx.moveTo(-R,i*R*.16-R*.2);ctx.lineTo(R,i*R*.16-R*.2);ctx.stroke();}
  ctx.restore();ctx.restore();
}
function drawFx(dt){
  for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.l-=dt;if(f.l<=0){fx.splice(i,1);continue}
    if(f.ring){ctx.strokeStyle=`rgba(255,235,59,${f.l*2.5})`;ctx.lineWidth=5;ctx.beginPath();ctx.arc(f.x,f.y,(.35-f.l)*220,0,6.28);ctx.stroke();continue}
    f.x+=f.vx*dt;f.y+=f.vy*dt;ctx.fillStyle=f.c;ctx.globalAlpha=Math.min(1,f.l*3);ctx.beginPath();ctx.arc(f.x,f.y,6,0,6.28);ctx.fill();ctx.globalAlpha=1}
}

/* ---------- HUD ---------- */
function hud(){
  const h=$('#hud');
  if(mode==='vs')h.innerHTML=`<span class="pill r">빨강팀: ${score.r}</span><span class="pill t">${Math.ceil(tLeft)}</span><span class="pill b">파랑팀: ${score.b}</span>`;
  else h.innerHTML=`<span class="pill r">${score.t}마리</span><span class="pill t">${Math.ceil(tLeft)}</span><span></span>`;
}

/* ---------- 메인 루프 ---------- */
function frame(ts){
  raf=requestAnimationFrame(frame);
  const dt=Math.min(.05,(ts-lastT)/1000||.016);lastT=ts;tick++;
  // 배경: 거울 모드 카메라
  ctx.save();ctx.translate(W,0);ctx.scale(-1,1);ctx.drawImage(video,0,0,W,H);ctx.restore();
  if(mode==='vs'){ctx.fillStyle='rgba(255,60,50,.10)';ctx.fillRect(0,0,W/2,H);ctx.fillStyle='rgba(60,120,255,.10)';ctx.fillRect(W/2,0,W/2,H);ctx.fillStyle='rgba(255,255,255,.7)';ctx.fillRect(W/2-2,0,4,H);}

  // 손/움직임 찾기 (매 프레임)
  let pts=[];
  if(useHands&&hands&&video.readyState>=2&&tick%2===0){
    try{const r=hands.detectForVideo(video,ts);
      for(const lm of r.landmarks||[]){
        const p=lm[9],w=lm[0],i=lm[5],pk=lm[17];
        const cx=1-(p.x*.7+w.x*.3);const cy=(p.y*.7+w.y*.3);
        pts.push({x:cx,y:cy,rot:0});}
      lastHand=pts;
    }catch(e){}
  }else if(useHands){pts=lastHand||[]}
  else{pts=motionPoints();}
  // 부드럽게 따라가기
  const nw=pts.map(p=>({x:p.x*W,y:p.y*H,rot:p.rot||0}));
  swats=nw.map(n=>{let best=null,bd=1e9;for(const o of swats){const d=(o.x-n.x)**2+(o.y-n.y)**2;if(d<bd){bd=d;best=o}}
    return best&&bd<(W*.2)**2?{x:best.x+(n.x-best.x)*.55,y:best.y+(n.y-best.y)*.55,rot:0}:n;});

  if(state==='play'){
    tLeft-=dt;
    if(mos.length<MAXMOS()&&Math.random()<dt*9)spawn();
    updateMos(dt);collide();
    if(Math.ceil(tLeft)<=3&&Math.ceil(tLeft)!==lastBeep){lastBeep=Math.ceil(tLeft);beep(880,.1)}
    if(tLeft<=0)endGame();
  }else if(state==='ready'){updateMos(dt)}
  for(const m of mos)drawMos(m);
  drawFx(dt);
  for(const s of swats)drawSwat(s);
  hud();
}
let lastBeep=0;

/* ---------- 흐름 ---------- */
async function start(m){
  mode=m;audio()&&audio().resume&&audio().resume();
  show('sLoad');$('#loadTxt').textContent='카메라를 켜는 중...';$('#loadSub').textContent='카메라 허용을 눌러 주세요';
  try{await initCamera();}
  catch(e){
    const n=e&&e.name||'오류';
    let why='카메라 허용을 눌렀는지 확인해 주세요.';
    if(n==='NotAllowedError')why='카메라가 "차단"되어 있어요.<br>주소창 왼쪽 아이콘 → 카메라 → 허용 으로 바꾸고 새로고침(F5) 해 주세요.<br>(학교 컴퓨터는 관리자가 막아 둔 경우도 있어요)';
    else if(n==='NotFoundError')why='카메라(웹캠)를 찾지 못했어요. 카메라 연결을 확인해 주세요.';
    else if(n==='NotReadableError')why='다른 프로그램(줌, 팀즈 등)이 카메라를 쓰고 있어요. 그 프로그램을 끄고 다시 해 주세요.';
    else if(!navigator.mediaDevices)why='이 주소에서는 카메라를 쓸 수 없어요. 인터넷 주소(https)로 열어야 해요.';
    $('#loadTxt').textContent='카메라를 켤 수 없어요';$('#loadSub').innerHTML=why+'<br><small>(오류: '+n+')</small>';
    setTimeout(()=>show('sHome'),9000);return;}
  if(hands===null&&useHands!==false){$('#loadTxt').textContent='손 인식을 준비하는 중...';$('#loadSub').textContent='처음 한 번은 조금 걸려요 (10초 안팎)';await initHands();}
  resize();show('game');
  score={r:0,b:0,t:0};mos=[];fx=[];swats=[];lastHand=[];prev=null;
  $('#caption').textContent=mode==='vs'?'1:1 대결! 내 쪽 모기를 잡아요':'친구들과 힘을 합쳐서 모기들을 잡아요';
  $('#msg').textContent=useHands?'':'※ 손 인식을 못 불러와 "움직임"으로 모기를 잡아요 (인터넷을 확인해 주세요)';
  for(let i=0;i<8;i++)spawn();
  tLeft=dur;state='ready';
  cancelAnimationFrame(raf);lastT=performance.now();raf=requestAnimationFrame(frame);
  // 카운트다운 3-2-1
  const c=$('#count');c.style.display='flex';
  for(const n of [3,2,1]){c.textContent=n;beep(520,.2);await new Promise(r=>setTimeout(r,800));}
  c.textContent='시작!';beep(990,.35);await new Promise(r=>setTimeout(r,500));c.style.display='none';
  state='play';lastBeep=0;
}
function endGame(){
  state='idle';cancelAnimationFrame(raf);
  const e=$('#endScore'),t=$('#endTitle'),s=$('#endSub');
  if(mode==='vs'){
    e.innerHTML=`<span class="sr">빨강 ${score.r}</span><span class="sb">파랑 ${score.b}</span>`;
    t.textContent=score.r===score.b?'무승부!':(score.r>score.b?'빨강팀 승리! 🎉':'파랑팀 승리! 🎉');
    s.textContent='모두 멋진 파리채 솜씨였어요!';
  }else{
    e.innerHTML=`<span>🦟 ${score.t}마리</span>`;
    t.textContent=score.t>=60?'모기 박멸 대성공! 🎉':score.t>=30?'우와, 정말 잘 잡았어요! 👏':'잘했어요! 한 번 더 도전해 볼까요?';
    s.textContent='친구들과 함께 잡으면 더 많이 잡을 수 있어요!';
  }
  show('sEnd');
}
</script>
